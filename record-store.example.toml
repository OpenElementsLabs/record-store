[server]
s3_bind = "0.0.0.0:7600"
api_bind = "0.0.0.0:7601"
shutdown_grace_period_seconds = 30
# Closes a connection whose request headers take longer than this to arrive, or
# that sits idle longer than this between requests.
header_read_timeout_seconds = 30
# Reverse-proxy hops whose X-Forwarded-For header may be believed. Empty means
# the header is ignored and every request is attributed to the socket it
# arrived on, which is safe everywhere and coarse behind a proxy: until the
# proxy is named here, every visitor through it shares one identity for rate
# limiting and appears in the audit trail as the proxy's address.
# Name only hops you actually run.
# trusted_proxies = ["10.0.0.0/8"]

[storage]
data_directory = "./data"
encryption_enabled = false # requires a stable RECORD_STORE_CREDENTIAL_MASTER_KEY
# Page cache, in MiB, for the catalog, audit trail and event journal. The part of
# memory that grows with history; it never exceeds this.
metadata_cache_mib = 128
# Keep this on the same filesystem as data_directory when overriding it: a payload is
# published by renaming it out of here, and a rename cannot cross a mount boundary.
# `record-store server doctor` refuses a deployment that gets this wrong.
# temporary_directory = "./data/tmp"

[auth]
# Supply root_access_key and root_secret_key through RECORD_STORE_ROOT_ACCESS_KEY and
# RECORD_STORE_ROOT_SECRET_KEY. Record Store deliberately has no default credentials.
# A stable RECORD_STORE_CREDENTIAL_MASTER_KEY is recommended for service accounts.
# Set RECORD_STORE_MANAGEMENT_SYSTEM_TOKEN to a distinct 32+ byte bearer token. Optional
# storage-administrator and auditor tokens can be supplied with their matching
# RECORD_STORE_MANAGEMENT_* environment variables.
# Set RECORD_STORE_METRICS_SCRAPE_TOKEN to an independent 32+ byte token to enable
# authenticated Prometheus scraping. Metrics stay closed when it is absent.
root_s3_enabled = true # disable after attaching policies to service accounts

[limits]
maximum_concurrent_operations = 256
# How long an operation may wait for one of those slots before it is refused with a
# retryable "slow down" rather than queued. The concurrency limit bounds the work in
# flight; this bounds the work waiting to be, which is what otherwise grows without
# limit under sustained overload.
admission_wait_limit_seconds = 15
maximum_custom_metadata_entries = 64
maximum_custom_metadata_bytes = 16384
maximum_header_bytes = 65536

[webhooks]
# Safe defaults require HTTPS and reject private/special-use destination IPs.
allow_http = false
allow_private_networks = false
request_timeout_seconds = 10
maximum_attempts = 6
poll_interval_seconds = 2

[lifecycle]
interval_seconds = 3600
batch_size = 100

[object_lock]
# A retention date is only as trustworthy as the clock judging it, so Record
# Store keeps a monotonic high-water mark of the furthest point in time it has
# observed and refuses to release a retained version while the clock is behind
# it. The interval refreshes that mark while the node is idle; the tolerance
# absorbs ordinary NTP correction rather than a jump.
clock_watermark_interval_seconds = 60
clock_backwards_tolerance_seconds = 5

[sharing]
# Share links are for people; embed links are for websites and applications.
# Both are unguessable, individually revocable capabilities that grant read
# access to exactly one object. Neither is ever a general storage credential.
shares_enabled = true
embeds_enabled = true
# Ceiling on how long a new link may live. Zero removes the ceiling, which
# means an administrator can create a link nobody will ever remember to retire.
maximum_lifetime_days = 365
# Turn these on for deployments where every externally shared object is
# sensitive by default.
require_expiration = false
require_share_password = false
maximum_access_count = 10000
# Abuse controls for the public routes. Password guessing is throttled per link
# and per client so a public link can never be locked for everyone; ordinary
# media range requests are not throttled at all.
password_attempts_per_minute = 10
token_probes_per_minute = 60
unlock_lifetime_hours = 12
# How much of a text or JSON object the console preview reads. The console says
# when it is showing a slice; the stored object is never altered.
preview_text_limit_bytes = 1048576
# Where each kind of link is published. A share link is a page a person opens,
# so it lives on the console. An embed serves object bytes into somebody else's
# page, so it lives on the S3-compatible storage endpoint — which is what lets a
# deployment expose storage to the internet while the management plane and the
# console stay closed.
#
# Leave share_base_url unset for a single-origin deployment; the console
# completes the link against the origin the administrator is already using.
# embed_base_url falls back to the S3 listener
# address, which is right for a local install and wrong behind any proxy.
# share_base_url = "https://record-store.example.com"
# embed_base_url = "https://storage.example.com"

[observability]
log_filter = "record_store=info,tower_http=info"
json = false
