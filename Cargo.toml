[workspace]
resolver = "3"
members = [
    "apps/record-store-cli",
    "apps/record-store-server",
    "crates/record-store-api",
    "crates/record-store-audit",
    "crates/record-store-cluster",
    "crates/record-store-consensus",
    "crates/record-store-events",
    "crates/record-store-erasure",
    "crates/record-store-lifecycle",
    "crates/record-store-auth",
    "crates/record-store-config",
    "crates/record-store-core",
    "crates/record-store-metadata",
    "crates/record-store-observability",
    "crates/record-store-protocol",
    "crates/record-store-replication",
    "crates/record-store-rpc",
    "crates/record-store-s3",
    "crates/record-store-service",
    "crates/record-store-sharing",
    "crates/record-store-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Record Store contributors"]

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.99"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
async-trait = "0.1.89"
axum = "0.8.4"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive", "env"] }
criterion = { version = "0.7.0", features = ["async_tokio"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
fs2 = "0.4.3"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
md-5 = "0.10.6"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
percent-encoding = "2.3.1"
prost = "0.13.5"
proptest = "1.9.0"
protoc-bin-vendored = "3.2.0"
redb = "2.6.3"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
reed-solomon-simd = "3.1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-util = { version = "0.7.16", features = ["io", "rt"] }
toml = "0.9.5"
tonic = { version = "0.13.1", default-features = false, features = ["codegen", "prost", "router", "tls-ring", "transport"] }
tonic-build = "0.13.1"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
