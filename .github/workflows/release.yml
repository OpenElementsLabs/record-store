# Publishes a Record Store release.
#
# The Git tag is the source of truth. Pushing v0.1.1 validates that the tag and
# the versions recorded in the repository agree, runs the release gates
# (release/gates.toml, integration stage) on a candidate built from the tag,
# publishes both production images to GHCR with SBOMs, extracts the Linux
# binaries from those images, runs the candidate-stage gates again against those
# extracted binaries, smoke-tests both architectures of what was actually
# published, evaluates every result into one decision, and only then creates the
# GitHub Release -- with the decision attached to it.
#
# Nothing that fails leaves a release behind: the GitHub Release is the last step
# and depends on every job before it. Images are pushed before the post-publish
# gates finish, so a failure there leaves a version-tagged image without a
# release; it is never repointed, and the next patch release supersedes it.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# One release at a time per tag, and never cancel one that may be mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      created: ${{ steps.created.outputs.created }}
      server-image: ${{ steps.images.outputs.server }}
      console-image: ${{ steps.images.outputs.console }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Refuses to continue when the tag and the repository disagree, so a
      # 0.1.1 tag can never publish a 0.1.0 binary.
      # Passed through the environment rather than interpolated into the shell:
      # a ref name is attacker-influenced input everywhere else, and there is no
      # reason for this to be the exception.
      - name: Check the tag against the repository
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release-version.sh "$TAG"

      # Images record the commit's timestamp rather than the clock, so that
      # re-running a release produces the same digest instead of a new one.
      - name: Read the release commit timestamp
        id: created
        run: echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      # GHCR rejects uppercase repository names, and the owner here is not
      # lowercase.
      - name: Resolve image names
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "server=ghcr.io/${owner}/record-store"
            echo "console=ghcr.io/${owner}/record-store-console"
          } >> "$GITHUB_OUTPUT"

  # Everything CI gates on, and the real-binary integration gates, on a
  # candidate built from the tag commit. Nothing is published unless this is
  # READY: an open release-blocking finding stops the release here.
  gates:
    name: Release gates (pre-publish)
    needs: validate
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/gates.yml
    with:
      stage: integration
      prefix: prepublish
      # Release rules: open release-blocking findings stop the release here,
      # before anything is pushed, and nothing is downgraded to a known failure.
      enforce-findings: true

  # Both images wait on the gates. A release is one artifact set: publishing a
  # server image while the console is broken would leave a version half released.
  server-image:
    name: Server image
    needs: [validate, gates]
    # A called workflow cannot hold more than its caller grants, so the two
    # attestation permissions have to be repeated here or the attest steps
    # inside container-image.yml fail with a missing OIDC token.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-image.yml
    with:
      image: ${{ needs.validate.outputs.server-image }}
      dockerfile: deploy/docker/Dockerfile
      slug: server
      title: Record Store
      description: Self-hosted, S3-compatible object storage written in Rust.
      version: ${{ needs.validate.outputs.version }}
      minor: ${{ needs.validate.outputs.minor }}
      major: ${{ needs.validate.outputs.major }}
      prerelease: ${{ needs.validate.outputs.prerelease }}
      created: ${{ needs.validate.outputs.created }}

  console-image:
    name: Console image
    needs: [validate, gates]
    # A called workflow cannot hold more than its caller grants, so the two
    # attestation permissions have to be repeated here or the attest steps
    # inside container-image.yml fail with a missing OIDC token.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-image.yml
    with:
      image: ${{ needs.validate.outputs.console-image }}
      dockerfile: deploy/docker/Dockerfile.console
      slug: console
      title: Record Store Console
      description: Web management console for Record Store.
      version: ${{ needs.validate.outputs.version }}
      minor: ${{ needs.validate.outputs.minor }}
      major: ${{ needs.validate.outputs.major }}
      prerelease: ${{ needs.validate.outputs.prerelease }}
      created: ${{ needs.validate.outputs.created }}

  binaries:
    name: Binary archives
    needs: [validate, server-image]
    runs-on: ubuntu-latest
    # The archives are downloaded and executed directly, with no registry in
    # between to carry a referrer, so they need provenance at least as much as
    # the images do. id-token mints the Sigstore certificate; attestations
    # records the result against the repository.
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Taken out of the published image rather than compiled again, so the
      # archive and the container can never contain different builds. `docker
      # create` only materialises the filesystem, so the foreign architecture
      # needs no emulation. Each platform is addressed by its own manifest
      # digest, because the local image store holds one image per digest
      # reference and would refuse the second pull otherwise.
      - name: Extract binaries from the published image
        env:
          IMAGE: ${{ needs.validate.outputs.server-image }}
          INDEX: ${{ needs.server-image.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for architecture in amd64 arm64; do
            digest="$(.github/scripts/platform-digest.sh "$IMAGE" "$INDEX" "$architecture")"
            staging="$(mktemp -d)"
            container="$(docker create "${IMAGE}@${digest}")"
            docker cp "${container}:/usr/local/bin/record-store" "${staging}/record-store"
            docker cp "${container}:/usr/local/bin/record-store-server" "${staging}/record-store-server"
            docker rm --force "$container" > /dev/null
            tar --create --gzip \
              --owner=0 --group=0 --numeric-owner \
              --file "dist/record-store-${VERSION}-linux-${architecture}.tar.gz" \
              --directory "$staging" record-store record-store-server
          done
          ls -l dist

      # Binds each archive to this workflow, this repository and this commit:
      #   gh attestation verify record-store-VERSION-linux-amd64.tar.gz \
      #     --repo OWNER/REPO
      - name: Attest the archives
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.tar.gz

      # The step above registers the attestation with GitHub's attestation API,
      # which is where `gh attestation verify` looks it up. That is a live
      # service call: it needs network, it needs the API to still hold the
      # record, and it tells a downloader nothing they can keep.
      #
      # So the same bundle is attached to the release. A downloader gets the
      # evidence in the same place they got the bytes, can archive it next to
      # them, and can verify without asking GitHub what it thinks of a file it
      # is also hosting. It is the asset an auditor is actually able to keep.
      - name: Publish the provenance alongside the archives
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${BUNDLE:-}" || ! -s "$BUNDLE" ]]; then
            echo "the attest step produced no bundle to publish" >&2
            exit 1
          fi
          cp "$BUNDLE" "dist/record-store-${VERSION}-provenance.intoto.jsonl"
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Run on each shipped architecture's native runner: pulling the index resolves
  # the platform the runner has, so without both runners arm64 is never run.
  smoke:
    name: Smoke test (${{ matrix.architecture }})
    needs: [validate, server-image, console-image]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    env:
      SERVER: ${{ needs.validate.outputs.server-image }}@${{ needs.server-image.outputs.digest }}
      CONSOLE: ${{ needs.validate.outputs.console-image }}@${{ needs.console-image.outputs.digest }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the image under test is this runner's architecture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          docker pull --quiet "$SERVER" > /dev/null
          actual="$(docker image inspect "$SERVER" --format '{{.Architecture}}')"
          if [[ "$actual" != "$ARCHITECTURE" ]]; then
            echo "pulled a ${actual} image on the ${ARCHITECTURE} runner" >&2
            exit 1
          fi

      # The check that stops a 0.1.1 tag shipping a 0.1.0 binary: ask the image.
      - name: Report the version from inside the image
        run: |
          set -euo pipefail
          reported="$(docker run --rm --entrypoint record-store "$SERVER" --version)"
          echo "$reported"
          if [[ "$reported" != "record-store ${VERSION}" ]]; then
            echo "the image reports '${reported}', expected 'record-store ${VERSION}'" >&2
            exit 1
          fi

      # Ephemeral credentials, generated here and thrown away with the runner.
      - name: Generate ephemeral credentials
        run: |
          set -euo pipefail
          for name in ROOT_SECRET MASTER_KEY SYSTEM_TOKEN; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done
      - name: Run the server container
        run: |
          set -euo pipefail
          docker network create record-store-smoke
          docker run --detach --name record-store --network record-store-smoke \
            --publish 7600:7600 --publish 7601:7601 \
            --volume record-store-smoke-data:/var/lib/record-store \
            --env RECORD_STORE_ROOT_ACCESS_KEY=smoke-access-key \
            --env "RECORD_STORE_ROOT_SECRET_KEY=${ROOT_SECRET}" \
            --env "RECORD_STORE_CREDENTIAL_MASTER_KEY=${MASTER_KEY}" \
            --env "RECORD_STORE_MANAGEMENT_SYSTEM_TOKEN=${SYSTEM_TOKEN}" \
            "$SERVER"

      - name: Wait for readiness
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:7601/ready > /dev/null; then
              curl --fail --silent http://127.0.0.1:7601/health
              echo
              exit 0
            fi
            sleep 2
          done
          echo "the server never became ready" >&2
          docker logs record-store >&2
          exit 1

      - name: Check the S3 listener
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:7600/)"
          echo "S3 listener answered with HTTP ${status}"
          if [[ ! "$status" =~ ^[1-5][0-9][0-9]$ ]]; then
            echo "the S3 listener on 7600 did not answer" >&2
            docker logs record-store >&2
            exit 1
          fi

      - name: Check management status through the CLI
        run: |
          set -euo pipefail
          docker exec --env "RECORD_STORE_MANAGEMENT_TOKEN=${SYSTEM_TOKEN}" record-store \
            record-store status --endpoint http://127.0.0.1:7601

      # The Dockerfile says USER record-store; this checks the running process.
      - name: Check the server does not run as root
        run: |
          set -euo pipefail
          uid="$(docker exec record-store id -u)"
          if [[ "$uid" == "0" ]]; then
            echo "the server container runs as root" >&2
            exit 1
          fi
          echo "running as uid ${uid}"

      # Writes an object, stops the container the way an orchestrator does, and
      # reads the object back from the same volume after a fresh start: SIGTERM
      # is handled (exit 0 within the documented --time 40) and data persists.
      - name: Check signal handling and persistence across a restart
        run: |
          set -euo pipefail
          api=http://127.0.0.1:7601/api/v1
          auth=(--header "authorization: Bearer ${SYSTEM_TOKEN}")
          curl --fail --silent "${auth[@]}" --header 'content-type: application/json' \
            --data '{"name":"smoke-persistence"}' "${api}/buckets" > /dev/null
          head -c 1048576 /dev/urandom > probe.bin
          curl --fail --silent "${auth[@]}" --upload-file probe.bin \
            "${api}/buckets/smoke-persistence/object/probe.bin" > /dev/null
          started="$(date +%s)"
          docker stop --time 40 record-store > /dev/null
          elapsed=$(( $(date +%s) - started ))
          code="$(docker inspect record-store --format '{{.State.ExitCode}}')"
          echo "stopped in ${elapsed}s with exit code ${code}"
          if [[ "$code" != "0" || "$elapsed" -ge 40 ]]; then
            echo "SIGTERM did not produce a clean exit within the grace period" >&2
            docker logs record-store >&2
            exit 1
          fi
          docker start record-store > /dev/null
          for _ in $(seq 1 60); do
            curl --fail --silent --output /dev/null http://127.0.0.1:7601/ready && break
            sleep 1
          done
          curl --fail --silent "${auth[@]}" --output read.bin \
            "${api}/buckets/smoke-persistence/object-content/probe.bin"
          if ! cmp --silent probe.bin read.bin; then
            echo "the object did not survive a container restart on its volume" >&2
            exit 1
          fi

      - name: Run the console container
        run: |
          set -euo pipefail
          docker run --detach --name record-store-console --network record-store-smoke \
            --publish 7602:7602 \
            --env RECORD_STORE_API_URL=http://record-store:7601 \
            "$CONSOLE"
          for _ in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:7602/login; then
              exit 0
            fi
            sleep 2
          done
          echo "the console never served /login" >&2
          docker logs record-store-console >&2
          exit 1

      - name: Check the console runs a production build
        run: |
          set -euo pipefail
          mode="$(docker exec record-store-console printenv NODE_ENV)"
          if [[ "$mode" != "production" ]]; then
            echo "the console image runs with NODE_ENV=${mode}" >&2
            exit 1
          fi

      # Proves the console reached the management API rather than only that it
      # started: an unreachable server answers 503 here, not 200.
      - name: Check the console can reach the management API
        run: |
          set -euo pipefail
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'content-type: application/json' \
              --data "{\"token\":\"${SYSTEM_TOKEN}\"}" \
              http://127.0.0.1:7602/api/auth/login
          )"
          if [[ "$status" != "200" ]]; then
            echo "the console answered HTTP ${status} for a valid management token" >&2
            docker logs record-store-console >&2
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          docker logs record-store || true
          docker logs record-store-console || true

  # Statically linked builds, and the deb and rpm made from them.
  #
  # These are compiled rather than extracted from the container image, because
  # the image is glibc and the whole point of these artifacts is to not be. Each
  # architecture builds on its own native runner: a release build of this
  # workspace under QEMU turns a ten-minute job into an hour-long one.
  linux-packages:
    name: Linux packages (${{ matrix.architecture }})
    needs: [validate, gates]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            rpm-architecture: x86_64
            probe-image: debian:12-slim
          - architecture: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            rpm-architecture: aarch64
            probe-image: debian:12-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ring compiles C, so a musl target needs a musl C compiler as well as the
      # Rust standard library for that target.
      - name: Install the musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: musl-${{ matrix.architecture }}

      - name: Build the static binaries
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --locked --release --target ${{ matrix.target }} \
            --bin record-store --bin record-store-server

      # A dynamically linked binary here would produce a package that installs
      # on a system it cannot run on, and the failure would appear as a crash at
      # first start rather than as a dependency error.
      - name: Check the binaries are actually static
        run: |
          set -euo pipefail
          for binary in record-store record-store-server; do
            path="target/${{ matrix.target }}/release/${binary}"
            description="$(file -b "$path")"
            echo "${binary}: ${description}"
            if [[ "$description" != *"statically linked"* ]]; then
              echo "${binary} is not statically linked" >&2
              exit 1
            fi
          done

      - name: Build the archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --create --gzip \
            --owner=0 --group=0 --numeric-owner \
            --file "dist/record-store-${VERSION}-linux-${{ matrix.architecture }}-musl.tar.gz" \
            --directory "target/${{ matrix.target }}/release" \
            record-store record-store-server

      - name: Build the deb and the rpm
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          deploy/linux/build-packages.sh \
            "${{ matrix.architecture }}" "$VERSION" \
            "target/${{ matrix.target }}/release" dist

      # Installs what was just built and starts it, so a broken maintainer
      # script or a missing file fails the release instead of the first
      # operator who runs apt-get install.
      - name: Install and run the deb
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --volume "${PWD}/dist:/pkg:ro" ${{ matrix.probe-image }} bash -c '
            set -eu
            apt-get update -qq > /dev/null
            apt-get install -y -qq curl > /dev/null
            apt-get install -y -qq "/pkg/record-store_'"${VERSION}"'_${{ matrix.architecture }}.deb" > /dev/null
            test -f /etc/record-store/record-store.env
            test "$(stat -c %a /etc/record-store/record-store.env)" = 600
            systemd-analyze verify /usr/lib/systemd/system/record-store.service
            set -a; . /etc/record-store/record-store.env; set +a
            record-store server --config /etc/record-store/record-store.toml check-config
            runuser -u record-store -- /usr/bin/record-store server \
              --config /etc/record-store/record-store.toml > /tmp/server.log 2>&1 &
            for _ in $(seq 1 60); do
              curl -fsS http://127.0.0.1:7601/ready > /dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS http://127.0.0.1:7601/ready
            echo
            reported="$(record-store --version)"
            test "$reported" = "record-store '"${VERSION}"'" || {
              echo "the package reports ${reported}" >&2; exit 1; }
          '

      - name: Install the rpm
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --volume "${PWD}/dist:/pkg:ro" rockylinux/rockylinux:9 bash -c '
            set -eu
            dnf install -y -q "/pkg/record-store-'"${VERSION}"'-1.${{ matrix.rpm-architecture }}.rpm"
            test -f /etc/record-store/record-store.env
            test "$(stat -c %a /etc/record-store/record-store.env)" = 600
            rpm -q --configfiles record-store | grep -q /etc/record-store/record-store.toml
            set -a; . /etc/record-store/record-store.env; set +a
            record-store server --config /etc/record-store/record-store.toml check-config
            reported="$(record-store --version)"
            test "$reported" = "record-store '"${VERSION}"'" || {
              echo "the package reports ${reported}" >&2; exit 1; }
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The Helm chart, published to GHCR as an OCI artifact beside the images and
  # attached to the release as a tarball for air-gapped installs.
  chart:
    name: Helm chart
    needs: [validate, server-image, console-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Lint and render the chart
        run: .github/scripts/chart-check.sh

      # The chart version and its appVersion are both the release version, so a
      # chart can never be ambiguous about which Record Store it deploys.
      - name: Package the chart
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package deploy/kubernetes/helm/record-store \
            --version "$VERSION" --app-version "$VERSION" --destination dist
          ls -l dist

      - name: Publish the chart to GHCR
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/record-store-${VERSION}.tgz" "oci://ghcr.io/${owner}/charts"
          echo "Published \`oci://ghcr.io/${owner}/charts/record-store:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: Verify attestations
    needs: [validate, server-image, console-image, binaries]
    runs-on: ubuntu-latest
    # Read-only. This job proves the claim the release makes; it must not be
    # able to create the evidence it is checking.
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: binaries
          merge-multiple: true

      # Queries the same public attestation service a user would, so a pass here
      # means `gh attestation verify` will also pass for whoever downloads the
      # release. Failing stops the release from being created at all.
      - name: Verify provenance and SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/verify-attestations.sh \
            "${{ github.repository }}" \
            dist \
            "${{ needs.validate.outputs.server-image }}" \
            "${{ needs.server-image.outputs.digest }}" \
            "${{ needs.validate.outputs.console-image }}" \
            "${{ needs.console-image.outputs.digest }}"

  # The candidate-stage gates again, against the binaries extracted from the
  # published image rather than a local build, so every artifact-bound result
  # names the digests that ship. ART-PACKAGE is deferred to release-decision.
  artifact-gates:
    name: Release gates (published artifacts)
    needs: [validate, binaries]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/gates.yml
    with:
      stage: candidate
      prefix: candidate
      candidate-artifact: binaries
      defer: ART-PACKAGE

  # One decision over every result, after packaging has been proven. It runs
  # only when provenance and both smoke jobs succeeded, which is the only place
  # ART_PACKAGE_VERIFIED is ever set. The report is attached to the release, so
  # the evidence is retained as long as the release is.
  release-decision:
    name: Release decision
    needs: [validate, gates, artifact-gates, smoke, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{prepublish,candidate}-*"
          path: collected
      - name: Record ART-PACKAGE
        env:
          ART_PACKAGE_VERIFIED: "true"
        run: |
          set -euo pipefail
          mkdir -p candidate-x && tar -xzf collected/candidate-candidate/candidate.tar.gz -C candidate-x
          python3 tests/gates/record.py --gate ART-PACKAGE --stage candidate \
            --candidate candidate-x/candidate --results collected/release-decision
      - name: Evaluate
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # GitHub runs steps with bash -e. A BLOCKED decision exits 1, and the
          # summary, the outputs and the report must still be written after it.
          set +e
          set -uo pipefail
          results=()
          for directory in collected/*-results-* collected/release-decision; do results+=(--results "$directory"); done
          python3 tests/gates/evaluate.py --stage candidate --candidate candidate-x/candidate "${results[@]}" --out report
          status=$?
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p dist
          cp report/report.json "dist/record-store-${VERSION}-release-gates.json"
          cp report/report.md "dist/record-store-${VERSION}-release-gates.md"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-gates-report
          path: dist/*
          if-no-files-found: error
          retention-days: 400

  release:
    name: GitHub Release
    needs: [validate, server-image, console-image, binaries, linux-packages, chart, smoke, provenance, release-decision]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: binaries
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: sbom-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: linux-packages-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: chart
          merge-multiple: true

      # The decision that allowed this release, attached so it is kept with it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          name: release-gates-report

      # Checksums are generated from the assets that exist, so the file can
      # never list something that was not published.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release assets were produced" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Compose release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          SERVER_IMAGE: ${{ needs.validate.outputs.server-image }}
          SERVER_DIGEST: ${{ needs.server-image.outputs.digest }}
          CONSOLE_IMAGE: ${{ needs.validate.outputs.console-image }}
          CONSOLE_DIGEST: ${{ needs.console-image.outputs.digest }}
          ASSET_DIRECTORY: dist
        run: .github/scripts/release-notes.sh > release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          arguments=(
            "$TAG"
            --verify-tag
            --title "Record Store $TAG"
            --notes-file release-notes.md
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}" dist/*
