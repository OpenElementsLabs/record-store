name: CI

# Tag pushes are handled by release.yml, which runs these same gates itself
# before it publishes anything. Without the branch filter every release would
# run the whole suite twice.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build release binaries
        run: cargo build --workspace --release --locked

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install console dependencies
        working-directory: console
        run: npm ci

      - name: Check console formatting
        working-directory: console
        run: npm run format:check

      - name: Lint console
        working-directory: console
        run: npm run lint

      - name: Type-check console
        working-directory: console
        run: npm run typecheck

      - name: Test console
        working-directory: console
        run: npm test

      - name: Build console
        working-directory: console
        run: npm run build

  console-e2e:
    runs-on: ubuntu-latest
    needs: [verify, console]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install console dependencies
        working-directory: console
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: Build console
        working-directory: console
        run: npm run build

      - name: Run standalone E2E
        working-directory: console
        run: npm run test:e2e

      - name: Run real-cluster E2E
        working-directory: console
        run: npm run test:e2e:cluster

  s3-compatibility:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/compatibility/go/go.mod
          cache-dependency-path: tests/compatibility/go/go.sum
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tests/compatibility/java/pom.xml

      - name: Run boto3, JavaScript, Go, and Java SDK compatibility
        run: tests/compatibility/run.sh

  # Catches a broken production Dockerfile before a tag is pushed, when fixing it
  # is still cheap. One architecture is enough for that; the release builds both.
  container-build:
    name: container-build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: deploy/docker/Dockerfile
          - image: console
            dockerfile: deploy/docker/Dockerfile.console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build the production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # Validation only. Nothing is published outside the release workflow.
          push: false
          load: false
          # The same scope the release workflow uses for this image's amd64
          # build, so a release can reuse what CI already compiled.
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64

  # Lints the Helm chart and validates every render shape against the real
  # Kubernetes schemas. Costs seconds, and catches the template errors that
  # otherwise surface as a failed `helm install` during a release.
  helm-chart:
    name: helm-chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Lint and render the chart
        run: .github/scripts/chart-check.sh

      # Proves the chart actually runs, not only that it renders: a single node
      # on a throwaway cluster, waited on until its probes pass. The published
      # image is used, so this also catches a chart that disagrees with the
      # image it deploys.
      - name: Install the chart on a kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: chart-check

      - name: Deploy and probe
        run: .github/scripts/chart-smoke.sh

  rust-security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@de5687a3b26eb438afcf64719052c77a7f728817 # cargo-audit

      - name: Audit Rust dependencies
        run: tests/rust-audit.sh

  # Keeps the fuzz targets honest. Running them here is not the search -- that
  # happens in longer campaigns against a kept corpus -- it is what stops a
  # renamed parser from leaving behind a harness that compiles and reaches
  # nothing.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-fuzz builds with sanitizers and a coverage instrumentation pass
      # that only nightly accepts, so this job deliberately steps outside the
      # toolchain the rest of the build is pinned to. Nothing it produces ships.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Smoke-run every fuzz target
        run: tests/fuzz-smoke.sh

      # A crash is reproducible only with the input that caused it, and libFuzzer
      # writes that input to a file rather than to the log.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
