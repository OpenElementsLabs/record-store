name: CI

# Tag pushes are handled by release.yml, which runs these same gates itself
# before it publishes anything. Without the branch filter every release would
# run the whole suite twice.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build release binaries
        run: cargo build --workspace --release --locked

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install console dependencies
        working-directory: console
        run: npm ci

      - name: Check console formatting
        working-directory: console
        run: npm run format:check

      - name: Lint console
        working-directory: console
        run: npm run lint

      - name: Type-check console
        working-directory: console
        run: npm run typecheck

      - name: Test console
        working-directory: console
        run: npm test

      - name: Build console
        working-directory: console
        run: npm run build

  console-e2e:
    runs-on: ubuntu-latest
    needs: [verify, console]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install console dependencies
        working-directory: console
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: Build console
        working-directory: console
        run: npm run build

      - name: Run standalone E2E
        working-directory: console
        run: npm run test:e2e

      - name: Run real-cluster E2E
        working-directory: console
        run: npm run test:e2e:cluster

  s3-compatibility:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/compatibility/go/go.mod
          cache-dependency-path: tests/compatibility/go/go.sum

      - name: Run boto3, AWS SDK for JavaScript, and AWS SDK for Go compatibility
        run: tests/compatibility/run.sh

  # Catches a broken production Dockerfile before a tag is pushed, when fixing it
  # is still cheap. One architecture is enough for that; the release builds both.
  container-build:
    name: container-build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: deploy/docker/Dockerfile
          - image: console
            dockerfile: deploy/docker/Dockerfile.console
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # Validation only. Nothing is published outside the release workflow.
          push: false
          load: false
          # The same scope the release workflow uses for this image's amd64
          # build, so a release can reuse what CI already compiled.
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64

  rust-security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: tests/rust-audit.sh
