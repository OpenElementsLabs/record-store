name: CI

# Tag pushes are handled by release.yml, which runs these same gates itself
# before it publishes anything. Without the branch filter every release would
# run the whole suite twice.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which gate stage this change needs. A change that touches only prose runs
  # the fast pr stage; anything that can change behaviour, packaging, or the
  # gates themselves runs the integration stage, which adds the real-binary
  # correctness, compatibility, recovery, overload and redaction gates.
  changes:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: stage
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # A push to candidate/<name> evaluates that commit as a release
          # candidate -- every gate, including performance and endurance --
          # without publishing anything. It is how a candidate is evaluated
          # before gates.yml can be dispatched from the default branch.
          if [[ "$REF" == refs/heads/candidate/* ]]; then
            echo "stage=candidate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${BASE:-}" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "stage=integration" >> "$GITHUB_OUTPUT"   # unknown base: assume the broader stage
            exit 0
          fi
          if git diff --name-only "$BASE...HEAD" | grep -qvE '^(docs/|internal/|README\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|ANNOUNCEMENT\.md$|mkdocs\.yml$|requirements-docs\.txt$)'; then
            echo "stage=integration" >> "$GITHUB_OUTPUT"
          else
            echo "stage=pr" >> "$GITHUB_OUTPUT"
          fi

  # Formatting, Clippy, tests, console checks, SDK compatibility, end-to-end,
  # dependency and secret scanning, fuzz smoke, and on integration changes the
  # real-binary gates: all defined in release/gates.toml. The gates / report
  # job is the one to require in branch protection -- it is red whenever any
  # gate of the stage failed or never ran.
  gates:
    needs: changes
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read
      actions: read
    with:
      stage: ${{ needs.changes.outputs.stage }}
      # A candidate/* push evaluates everything that can run without
      # publishing. ART-PACKAGE only exists inside release.yml after provenance
      # and smoke, so it is deferred rather than reported MISSING; the 30-minute
      # endurance run is left to the weekly schedule and reused from there, as
      # release.yml does.
      defer: ${{ needs.changes.outputs.stage == 'candidate' && 'ART-PACKAGE' || '' }}
      skip: ${{ needs.changes.outputs.stage == 'candidate' && 'PERF-ENDURANCE' || '' }}

  # Catches a broken production Dockerfile before a tag is pushed, when fixing it
  # is still cheap. One architecture is enough for that; the release builds both.
  container-build:
    name: container-build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: deploy/docker/Dockerfile
          - image: console
            dockerfile: deploy/docker/Dockerfile.console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # Validation only. Nothing is published outside the release workflow.
          push: false
          load: false
          # The same scope the release workflow uses for this image's amd64
          # build, so a release can reuse what CI already compiled.
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
