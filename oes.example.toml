[server]
s3_bind = "0.0.0.0:7600"
api_bind = "0.0.0.0:7601"
shutdown_grace_period_seconds = 30

[storage]
data_directory = "./data"
# Keep this on the same filesystem as data_directory when overriding it.
# temporary_directory = "./data/tmp"

[auth]
# Supply root_access_key and root_secret_key through OES_ROOT_ACCESS_KEY and
# OES_ROOT_SECRET_KEY. OES deliberately has no default credentials.
# A stable OES_CREDENTIAL_MASTER_KEY is recommended for service accounts.

[limits]
maximum_concurrent_operations = 256
maximum_custom_metadata_entries = 64
maximum_custom_metadata_bytes = 16384
maximum_header_bytes = 65536

[observability]
log_filter = "oes=info,tower_http=info"
json = false
