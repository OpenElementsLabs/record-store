[server]
mode = "standalone" # default; use "cluster" for storage nodes or "control" for management-only nodes
s3_bind = "0.0.0.0:7600"
api_bind = "0.0.0.0:7601"
rpc_bind = "0.0.0.0:7603" # unused in standalone mode; no RPC listener starts
# rpc_advertise = "storage-1.internal:7603"
shutdown_grace_period_seconds = 30

# The [cluster] section below is entirely optional and ignored in standalone
# mode. It only matters when server.mode is "cluster" or "control". A fresh
# standalone installation needs nothing beyond [server] and [storage].
#
# [cluster]
# # Joining nodes set seeds plus a short-lived OES_CLUSTER_JOIN_TOKEN. A first
# # cluster node leaves both empty and forms the initial one-member Raft group.
# seeds = []
# storage_class = "standard"
# failure_domain = ""
# replication_factor = 3
# consensus_heartbeat_millis = 250
# election_timeout_min_millis = 1000
# election_timeout_max_millis = 2000
# snapshot_logs_threshold = 8192
# retained_logs = 2048
# movement_concurrency = 4
# movement_bytes_per_second = 67108864
# reconcile_interval_seconds = 300
#
# [cluster.tls]
# # Production clusters should configure a certificate, private key, peer CA,
# # and client CA for mutual TLS on internal port 7603.
# # certificate_path = "/etc/oes/tls/node.crt"
# # private_key_path = "/etc/oes/tls/node.key"
# # peer_ca_path = "/etc/oes/tls/ca.crt"
# # client_ca_path = "/etc/oes/tls/ca.crt"
# # server_name = "storage-1.internal"

[storage]
data_directory = "./data"
encryption_enabled = false # requires a stable OES_CREDENTIAL_MASTER_KEY
# Keep this on the same filesystem as data_directory when overriding it.
# temporary_directory = "./data/tmp"

[auth]
# Supply root_access_key and root_secret_key through OES_ROOT_ACCESS_KEY and
# OES_ROOT_SECRET_KEY. OES deliberately has no default credentials.
# A stable OES_CREDENTIAL_MASTER_KEY is recommended for service accounts.
# Set OES_MANAGEMENT_SYSTEM_TOKEN to a distinct 32+ byte bearer token. Optional
# storage-administrator and auditor tokens can be supplied with their matching
# OES_MANAGEMENT_* environment variables.
root_s3_enabled = true # disable after attaching policies to service accounts

[limits]
maximum_concurrent_operations = 256
maximum_custom_metadata_entries = 64
maximum_custom_metadata_bytes = 16384
maximum_header_bytes = 65536

[webhooks]
# Safe defaults require HTTPS and reject private/special-use destination IPs.
allow_http = false
allow_private_networks = false
request_timeout_seconds = 10
maximum_attempts = 6
poll_interval_seconds = 2

[lifecycle]
interval_seconds = 3600
batch_size = 100

[observability]
log_filter = "oes=info,tower_http=info"
json = false
