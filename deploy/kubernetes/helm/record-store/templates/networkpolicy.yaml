{{- if .Values.networkPolicy.enabled }}
{{- $clustered := eq (include "record-store.clustered" .) "true" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "record-store.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "record-store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "record-store.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # S3 traffic. Without an explicit allow-list this stays open to the whole
    # cluster, which is the only sane default for an endpoint whose clients the
    # chart cannot know.
    - ports:
        - port: s3
          protocol: TCP
      {{- with .Values.networkPolicy.s3From }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # The management API: the console, plus anything the operator names.
    - ports:
        - port: api
          protocol: TCP
      from:
        {{- if .Values.console.enabled }}
        - podSelector:
            matchLabels:
              {{- include "record-store.console.selectorLabels" . | nindent 14 }}
        {{- end }}
        # kubelet probes come from the node, not from a pod, and a podSelector
        # would never match them.
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- with .Values.networkPolicy.apiFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- if $clustered }}
    # Peer-to-peer consensus and replication, restricted to this release's own
    # server pods.
    - ports:
        - port: rpc
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "record-store.server.selectorLabels" . | nindent 14 }}
    {{- end }}
{{- end }}
