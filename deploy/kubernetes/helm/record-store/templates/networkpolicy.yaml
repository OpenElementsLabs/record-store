{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "record-store.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "record-store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "record-store.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # S3 traffic. Without an explicit allow-list this stays open to the whole
    # cluster, which is the only sane default for an endpoint whose clients the
    # chart cannot know.
    - ports:
        - port: s3
          protocol: TCP
      {{- with .Values.networkPolicy.s3From }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # The management API: the console, plus anything the operator names. With
    # neither there is no rule at all -- a rule with an empty `from` would
    # admit every source.
    {{- if or .Values.console.enabled .Values.networkPolicy.apiFrom }}
    - ports:
        - port: api
          protocol: TCP
      from:
        {{- if .Values.console.enabled }}
        - podSelector:
            matchLabels:
              {{- include "record-store.console.selectorLabels" . | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.apiFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- end }}
{{- end }}
