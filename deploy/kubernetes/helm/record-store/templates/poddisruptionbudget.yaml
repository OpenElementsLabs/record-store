{{- if .Values.podDisruptionBudget.enabled }}
{{- if le (int .Values.replicaCount) 1 }}
{{- fail "podDisruptionBudget.enabled has no meaning with a single replica: a standalone node cannot be drained without downtime." }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "record-store.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "record-store.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "record-store.server.selectorLabels" . | nindent 6 }}
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
{{- end }}
