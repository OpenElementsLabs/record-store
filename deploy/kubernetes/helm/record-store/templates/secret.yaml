{{- if not .Values.auth.existingSecret }}
{{- /*
  Fail at template time rather than leaving pods to CrashLoopBackOff with a
  configuration error. Record Store has no default credentials, so an install
  without these is not a degraded install, it is one that cannot start.
*/}}
{{- if not .Values.auth.rootAccessKey }}
{{- fail "auth.rootAccessKey is required (or set auth.existingSecret). Record Store ships no default credentials." }}
{{- end }}
{{- if not .Values.auth.rootSecretKey }}
{{- fail "auth.rootSecretKey is required (or set auth.existingSecret)." }}
{{- end }}
{{- if not .Values.auth.credentialMasterKey }}
{{- fail "auth.credentialMasterKey is required (or set auth.existingSecret). Generate one with: openssl rand -hex 32" }}
{{- end }}
{{- if not .Values.auth.managementSystemToken }}
{{- fail "auth.managementSystemToken is required (or set auth.existingSecret). Generate one with: openssl rand -hex 32" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "record-store.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "record-store.labels" . | nindent 4 }}
  annotations:
    # Keeps the Secret when the release is uninstalled, so reinstalling does not
    # orphan every credential already encrypted with the master key.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  root-access-key: {{ .Values.auth.rootAccessKey | quote }}
  root-secret-key: {{ .Values.auth.rootSecretKey | quote }}
  credential-master-key: {{ .Values.auth.credentialMasterKey | quote }}
  management-system-token: {{ .Values.auth.managementSystemToken | quote }}
  {{- with .Values.auth.managementStorageToken }}
  management-storage-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.managementAuditorToken }}
  management-auditor-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.metricsScrapeToken }}
  metrics-scrape-token: {{ . | quote }}
  {{- end }}
{{- end }}
