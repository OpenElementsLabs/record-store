# Serves the MkDocs output built by Dockerfile.docs. TLS is terminated by the
# reverse proxy in front (Coolify's Traefik), so this listens on plain HTTP.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # MkDocs writes every page as <page>/index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    # Pages change with every deploy; revalidate instead of serving stale HTML.
    # add_header here replaces the server-level headers, so they are repeated.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    error_page 404 /404.html;
}
