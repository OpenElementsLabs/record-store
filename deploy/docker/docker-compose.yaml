services:
  record-store:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile

    read_only: true

    tmpfs:
      - /tmp
      - /run

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    # Internal container ports.
    # 7600 gets an HTTPS domain through Coolify below.
    # 7601 has no domain and remains private.
    expose:
      - "7600"
      - "7601"

    environment:
      # Public S3 endpoint through Coolify/Traefik.
      SERVICE_FQDN_RECORDSTORE_7600: /

      # Generated once and retained by Coolify.
      RECORD_STORE_ROOT_ACCESS_KEY: "${SERVICE_USER_ROOTACCESS}"
      RECORD_STORE_ROOT_SECRET_KEY: "${SERVICE_PASSWORD_64_ROOTSECRET}"

      # Confirm the exact encoding required by Record Store before changing this.
      RECORD_STORE_CREDENTIAL_MASTER_KEY: "${SERVICE_BASE64_64_CREDENTIALMASTER}"

      RECORD_STORE_MANAGEMENT_SYSTEM_TOKEN: "${SERVICE_PASSWORD_64_SYSTEMTOKEN}"
      RECORD_STORE_MANAGEMENT_STORAGE_TOKEN: "${SERVICE_PASSWORD_64_STORAGETOKEN}"
      RECORD_STORE_MANAGEMENT_AUDITOR_TOKEN: "${SERVICE_PASSWORD_64_AUDITORTOKEN}"
      RECORD_STORE_METRICS_SCRAPE_TOKEN: "${SERVICE_PASSWORD_64_SCRAPETOKEN}"

      RECORD_STORE_STORAGE_ENCRYPTION_ENABLED: "${RECORD_STORE_STORAGE_ENCRYPTION_ENABLED:-true}"
      RECORD_STORE_ROOT_S3_ENABLED: "${RECORD_STORE_ROOT_S3_ENABLED:-true}"
      RECORD_STORE_LOG_JSON: "${RECORD_STORE_LOG_JSON:-true}"

    volumes:
      - record-store-data:/var/lib/record-store

    healthcheck:
      test:
        [
          "CMD",
          "record-store",
          "status",
          "--endpoint",
          "http://127.0.0.1:7601"
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  console:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.console

    read_only: true

    tmpfs:
      - /tmp
      - /run

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    depends_on:
      record-store:
        condition: service_healthy

    expose:
      - "7602"

    environment:
      SERVICE_FQDN_CONSOLE_7602: /

      RECORD_STORE_API_URL: "http://record-store:7601"

      RECORD_STORE_CONSOLE_SECURE_COOKIES: "${RECORD_STORE_CONSOLE_SECURE_COOKIES:-true}"

volumes:
  record-store-data:
