# Standalone OES plus the web console.
#
# The console talks only to the management API on 7601, over the Compose
# network. The S3 API stays available to applications on 7600 and is not used by
# the console for administration.
services:
  oes:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "7600:7600"
      - "7601:7601"
    environment:
      OES_ROOT_ACCESS_KEY: "${OES_ROOT_ACCESS_KEY:-local-admin}"
      OES_ROOT_SECRET_KEY: "${OES_ROOT_SECRET_KEY:-local-development-secret-change-me}"
      OES_CREDENTIAL_MASTER_KEY: "${OES_CREDENTIAL_MASTER_KEY:-local-development-master-key-change-me}"
      OES_MANAGEMENT_SYSTEM_TOKEN: "${OES_MANAGEMENT_SYSTEM_TOKEN:-local-development-management-token-change-me}"
      OES_STORAGE_ENCRYPTION_ENABLED: "${OES_STORAGE_ENCRYPTION_ENABLED:-true}"
      OES_LOG_JSON: "true"
    volumes:
      - oes-data:/var/lib/oes
    healthcheck:
      test: ["CMD", "oes", "status", "--endpoint", "http://127.0.0.1:7601"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  console:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.console
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      oes:
        condition: service_healthy
    ports:
      - "7602:7602"
    environment:
      # The console reaches OES over the Compose network, not from the browser.
      OES_API_URL: "http://oes:7601"
      # Local development is plain HTTP on loopback. Leave this unset behind TLS
      # so the session cookie is marked Secure.
      OES_CONSOLE_SECURE_COOKIES: "${OES_CONSOLE_SECURE_COOKIES:-false}"

volumes:
  oes-data:
