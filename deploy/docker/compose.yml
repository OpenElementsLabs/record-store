services:
  oes:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "7600:7600"
      - "7601:7601"
    environment:
      OES_ROOT_ACCESS_KEY: "${OES_ROOT_ACCESS_KEY:?set OES_ROOT_ACCESS_KEY}"
      OES_ROOT_SECRET_KEY: "${OES_ROOT_SECRET_KEY:?set OES_ROOT_SECRET_KEY}"
    volumes:
      - oes-data:/var/lib/oes
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  oes-data:
