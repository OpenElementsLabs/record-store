services:
  oes:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "7600:7600"
      - "7601:7601"
    environment:
      OES_ROOT_ACCESS_KEY: "${OES_ROOT_ACCESS_KEY:?set OES_ROOT_ACCESS_KEY}"
      OES_ROOT_SECRET_KEY: "${OES_ROOT_SECRET_KEY:?set OES_ROOT_SECRET_KEY}"
      OES_CREDENTIAL_MASTER_KEY: "${OES_CREDENTIAL_MASTER_KEY:?set a stable 32+ byte master key}"
      OES_STORAGE_ENCRYPTION_ENABLED: "${OES_STORAGE_ENCRYPTION_ENABLED:-true}"
      OES_MANAGEMENT_SYSTEM_TOKEN: "${OES_MANAGEMENT_SYSTEM_TOKEN:?set a distinct 32+ byte management token}"
      OES_ROOT_S3_ENABLED: "${OES_ROOT_S3_ENABLED:-true}"
      OES_WEBHOOK_ALLOW_HTTP: "${OES_WEBHOOK_ALLOW_HTTP:-false}"
      OES_WEBHOOK_ALLOW_PRIVATE_NETWORKS: "${OES_WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}"
      OES_LIFECYCLE_INTERVAL_SECONDS: "${OES_LIFECYCLE_INTERVAL_SECONDS:-3600}"
    volumes:
      - oes-data:/var/lib/oes
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  oes-data:
