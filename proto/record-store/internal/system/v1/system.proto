syntax = "proto3";

package record_store.internal.system.v1;

// Identity a node advertises to its peers.
//
// Node identity is opaque and stable: it is never derived from a hostname, IP
// address, or container identifier, because all three change.
message NodeDescriptor {
  string node_id = 1;
  uint64 member_id = 2;
  uint32 protocol_major_version = 3;
  uint32 protocol_minor_version = 4;
  string software_version = 5;
  uint32 storage_format_version = 6;
  uint32 cluster_format_version = 7;
  // Empty until the node has bound itself to a cluster.
  string cluster_id = 8;
  string rpc_address = 9;
  // Whether the node stores object replicas.
  bool storage_node = 10;
}

// Topology labels and capacity a node reports about itself.
message NodeProfile {
  string storage_class = 1;
  map<string, string> failure_domain = 2;
  uint64 total_bytes = 3;
  uint64 available_bytes = 4;
  uint64 replica_bytes = 5;
  uint64 temporary_bytes = 6;
  // RFC 3339 process start time.
  string started_at = 7;
  // Endpoint S3 clients may use, when the node is client reachable.
  string s3_endpoint = 8;
}

message PingRequest {
  NodeDescriptor peer = 1;
}

message PingResponse {
  NodeDescriptor peer = 1;
  // Whether this node currently holds metadata leadership.
  bool metadata_leader = 2;
  // Advertised address of the current metadata leader, when one is known.
  string metadata_leader_address = 3;
}

message JoinRequest {
  // Single-use join token issued by an administrator.
  string join_token = 1;
  NodeDescriptor peer = 2;
  NodeProfile profile = 3;
}

message JoinResponse {
  string cluster_id = 1;
  uint64 member_id = 2;
  // Node credential shown exactly once; the node persists it locally.
  string node_credential = 3;
  // Whether the cluster wants this node to vote in metadata consensus.
  bool metadata_voter = 4;
  // JSON-encoded cluster configuration in effect.
  string cluster_config = 5;
}

message ActivateRequest {
  NodeDescriptor peer = 1;
  NodeProfile profile = 2;
}

message ActivateResponse {
  bool activated = 1;
  bool metadata_voter = 2;
}

// Node lifecycle and diagnostics exchanged between Record Store processes.
service SystemService {
  // Confirms identity, protocol compatibility, and cluster membership.
  rpc Ping(PingRequest) returns (PingResponse);
  // Exchanges a join token for a cluster binding and node credential.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Adds an already-bound node to the metadata consensus group.
  rpc Activate(ActivateRequest) returns (ActivateResponse);
}
