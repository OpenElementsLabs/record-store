syntax = "proto3";

package oes.internal.replica.v1;

// What a replica transfer is expected to contain.
//
// The receiving node always recomputes these values from the bytes it actually
// stores; a source node's claim is never sufficient on its own.
message ReplicaDescriptor {
  string object_id = 1;
  uint64 size = 2;
  // Canonical "<algorithm>:<hex digest>" form. Empty when the expectation is
  // only known after the last byte, which is the case for a client upload
  // being replicated as it streams in.
  string checksum = 3;
}

message WriteReplicaHeader {
  // Stable operation identity, so a retried transfer is recognized rather than
  // creating a second logical replica.
  string operation_id = 1;
  ReplicaDescriptor descriptor = 2;
}

// Closes a transfer whose expectation was not known in advance.
message WriteReplicaCommit {
  uint64 size = 1;
  string checksum = 2;
}

message WriteReplicaChunk {
  oneof body {
    WriteReplicaHeader header = 1;
    bytes data = 2;
    WriteReplicaCommit commit = 3;
  }
}

message WriteReplicaResponse {
  string operation_id = 1;
  string object_id = 2;
  uint64 size = 3;
  string checksum = 4;
  bool already_present = 5;
}

message ReadReplicaRequest {
  string object_id = 1;
  uint64 size = 2;
  // Canonical checksum to verify while streaming a complete payload.
  string checksum = 3;
  // Byte range. A length of zero with offset zero means the whole payload.
  uint64 offset = 4;
  uint64 length = 5;
  bool whole_payload = 6;
}

message ReadReplicaChunk {
  bytes data = 1;
}

message DeleteReplicaRequest {
  string object_id = 1;
}

message DeleteReplicaResponse {
  bool removed = 1;
}

message VerifyReplicaRequest {
  string object_id = 1;
  uint64 size = 2;
  string checksum = 3;
}

message VerifyReplicaResponse {
  bool present = 1;
  bool matches = 2;
  uint64 size = 3;
  string checksum = 4;
}

message StatReplicaRequest {
  string object_id = 1;
}

message StatReplicaResponse {
  bool present = 1;
  uint64 physical_bytes = 2;
}

message ListLocalPayloadsRequest {
  string after_object_id = 1;
  uint32 limit = 2;
}

message ListLocalPayloadsResponse {
  repeated string object_ids = 1;
}

// Replica transfer and integrity operations between storage nodes.
service ReplicaService {
  // Streams a replica onto the target node. Bytes are staged, verified, and
  // only then published, so a failed transfer leaves nothing visible.
  rpc WriteReplica(stream WriteReplicaChunk) returns (WriteReplicaResponse);
  // Streams a replica out of the target node.
  rpc ReadReplica(ReadReplicaRequest) returns (stream ReadReplicaChunk);
  rpc DeleteReplica(DeleteReplicaRequest) returns (DeleteReplicaResponse);
  rpc VerifyReplica(VerifyReplicaRequest) returns (VerifyReplicaResponse);
  rpc StatReplica(StatReplicaRequest) returns (StatReplicaResponse);
  rpc ListLocalPayloads(ListLocalPayloadsRequest) returns (ListLocalPayloadsResponse);
}
